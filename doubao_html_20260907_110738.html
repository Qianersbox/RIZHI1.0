<!DOCTYPE html>
<html lang="zh‑CN">
<head>
<meta charset="UTF‑8">
<meta name="viewport" content="width=device‑width, initial‑scale=1.0">
<title>个人工作日志</title>
<link rel="manifest" href="manifest.json">
<meta name="theme‑color" content="#2563eb">
<style>
*{box‑sizing:border‑box;margin:0;padding:0;font‑family:‑apple‑system,BlinkMacSystemFont,"Segoe UI",Roboto,sans‑serif;}
body{background:#f5f7fa;color:#222;padding:16px;max‑width:720px;margin:0 auto;}
.header{margin‑bottom:20px;}
h1{font‑size:22px;margin‑bottom:6px;}
.desc{color:#666;font‑size:14px;}
.card{background:#fff;border‑radius:12px;padding:16px;margin‑bottom:16px;box‑shadow:0 1px 4px #00000012;}
textarea{width:100%;min‑height:120px;border:1px solid #ddd;border‑radius:8px;padding:12px;font‑size:15px;resize:vertical;margin‑bottom:12px;}
.btn‑group{display:flex;gap:10px;flex‑wrap:wrap;}
button{padding:10px 16px;border:none;border‑radius:8px;font‑size:15px;cursor:pointer;}
.btn‑voice{background:#2563eb;color:#fff;}
.btn‑save{background:#16a34a;color:#fff;}
.btn‑analyze{background:#9333ea;color:#fff;}
.btn‑clear{background:#ef4444;color:#fff;}
.log‑item{border‑bottom:1px solid #eee;padding:14px 0;}
.log‑date{font‑weight:bold;margin‑bottom:6px;color:#2563eb;}
pre{white‑space:pre‑wrap;font‑size:14px;line‑height:1.6;color:#333;}
.tip{font‑size:13px;color:#888;margin‑top:8px;}
</style>
</head>
<body>
<div class="header">
<h1>📒个人工作日志</h1>
<div class="desc">语音录入｜本地保存｜工作规律分析</div>
</div>

<div class="card">
<h3>新增今日日志</h3>
<textarea id="logInput" placeholder="点击麦克风语音输入，或者手动输入今日工作..."></textarea>
<div class="btn‑group">
<button class="btn‑voice" id="voiceBtn">🎤语音输入</button>
<button class="btn‑save" id="saveBtn">💾保存日志</button>
<button class="btn‑analyze" id="analyzeBtn">📊生成分析提示词</button>
<button class="btn‑clear" id="clearAll">🗑清空全部</button>
</div>
<div class="tip">提示：数据保存在App本地；语音识别需要联网</div>
</div>

<div class="card">
<h3>全部日志记录</h3>
<div id="logList"></div>
</div>

<script>
const logInput = document.getElementById('logInput');
const voiceBtn = document.getElementById('voiceBtn');
const saveBtn = document.getElementById('saveBtn');
const analyzeBtn = document.getElementById('analyzeBtn');
const clearAll = document.getElementById('clearAll');
const logList = document.getElementById('logList');

function getLogs(){
    const raw = localStorage.getItem('workLogs');
    return raw ? JSON.parse(raw) : [];
}
function saveLogs(list){
    localStorage.setItem('workLogs', JSON.stringify(list));
}

function render(){
    const logs = getLogs();
    logList.innerHTML = '';
    if(logs.length===0){
        logList.innerHTML = '<div class="tip">暂无日志记录，请新增第一条</div>';
        return;
    }
    logs.slice().reverse().forEach(item=>{
        const div = document.createElement('div');
        div.className = 'log‑item';
        div.innerHTML = `<div class="log‑date">${item.date}</div><pre>${item.content}</pre>`;
        logList.appendChild(div);
    })
}

saveBtn.onclick = ()=>{
    const text = logInput.value.trim();
    if(!text){alert('请填写日志内容');return;}
    const now = new Date();
    const dateStr = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
    const logs = getLogs();
    logs.push({date:dateStr, content:text});
    saveLogs(logs);
    logInput.value = '';
    render();
    alert('日志保存成功');
}

voiceBtn.onclick = ()=>{
    if(!('webkitSpeechRecognition' in window)){
        alert('当前环境不支持语音识别');
        return;
    }
    const rec = new webkitSpeechRecognition();
    rec.lang = 'zh‑CN';
    rec.continuous = false;
    rec.interimResults = false;
    rec.start();
    voiceBtn.innerText = '🔴识别中...';
    rec.onresult = (e)=>{
        const txt = e.results[0][0].transcript;
        logInput.value += txt;
        voiceBtn.innerText = '🎤语音输入';
    }
    rec.onerror = ()=>{
        voiceBtn.innerText = '🎤语音输入';
        alert('语音识别出错，请重试');
    }
}

analyzeBtn.onclick = ()=>{
    const logs = getLogs();
    if(logs.length===0){alert('没有日志，无法分析');return;}
    let allText = logs.map(i=>i.content).join('\n');
    const prompt = `基于下面全部工作日志文本，帮我分析我的工作规律：
1、区分家庭事务和工作事务
2、高频沟通对象、高频工作事项
3、哪些任务经常只停留在计划没有落地
4、时间分配特点
5、给出简单优化建议
日志内容：
${allText}`;
    alert('复制下面全部文本，粘贴给AI即可生成分析报告：\n\n'+prompt);
}

clearAll.onclick = ()=>{
    if(confirm('确认要删除全部日志记录吗？不可恢复！')){
        localStorage.removeItem('workLogs');
        render();
    }
}

render();
</script>
</body>
</html>
