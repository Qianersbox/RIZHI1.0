<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>工作日志</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0b1020" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}

body{
  background:
    radial-gradient(circle at 10% 10%, rgba(37,99,235,.18), transparent 35%),
    radial-gradient(circle at 90% 20%, rgba(59,130,246,.12), transparent 35%),
    linear-gradient(180deg,#0b1020 0%,#08091c 100%);
  color:#e5e7eb;
  min-height:100vh;
  max-width:480px;
  margin:0 auto;
  overflow:hidden;
}

.page{
  display:none;
  flex-direction:column;
  height:100vh;
}

.page.active{
  display:flex;
}

.top-space{
  flex:none;
  height:18vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.mic-button{
  width:72px;
  height:72px;
  border-radius:50%;
  border:none;
  background:linear-gradient(135deg,#2563eb,#1d4ed8);
  color:white;
  font-size:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  box-shadow:
    0 0 0 8px rgba(37,99,235,.25),
    0 8px 24px rgba(37,99,235,.35);
  transition:.22s ease;
}

.mic-button.recording{
  background:linear-gradient(135deg,#ef4444,#dc2626);
  box-shadow:
    0 0 0 8px rgba(239,68,68,.25),
    0 8px 24px rgba(239,68,68,.35);
  animation:pulse 1.4s infinite;
}

@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.08);}
  100%{transform:scale(1);}
}

.hint-text{
  margin-top:14px;
  font-size:13px;
  color:#9ca3af;
  text-align:center;
}

.chat-container{
  flex:1;
  width:92%;
  margin:0 auto;
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.08);
  border-radius:16px;
  padding:14px;
  overflow-y:auto;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.02), 0 4px 20px rgba(0,0,0,.18);
}

.chat-container::-webkit-scrollbar{
  width:6px;
}

.chat-container::-webkit-scrollbar-track{
  background:transparent;
}

.chat-container::-webkit-scrollbar-thumb{
  background:rgba(255,255,255,.12);
  border-radius:3px;
}

.bubble{
  max-width:85%;
  padding:12px 14px;
  border-radius:18px;
  font-size:15px;
  line-height:1.65;
  margin-bottom:12px;
  white-space:pre-wrap;
  word-break:break-word;
}

.bubble.user{
  background:rgba(37,99,235,.85);
  color:white;
  margin-left:auto;
  border-bottom-right-radius:4px;
}

.bubble.ai{
  background:rgba(255,255,255,.08);
  color:#e5e7eb;
  margin-right:auto;
  border-bottom-left-radius:4px;
}

.welcome{
  color:#9ca3af;
  font-size:14px;
  text-align:center;
  padding:10px 0;
}

.bottom-nav{
  flex:none;
  padding:18px 16px 22px;
  display:flex;
  justify-content:space-around;
  align-items:center;
  background:linear-gradient(0deg,rgba(11,16,32,.95),transparent);
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  color:#9ca3af;
  font-size:12px;
  cursor:pointer;
  transition:.18s;
}

.nav-item span:first-child{
  font-size:20px;
}

.nav-item.active{
  color:#2563eb;
}

.list-container{
  flex:1;
  width:92%;
  margin:0 auto;
  overflow-y:auto;
  padding-bottom:16px;
}

.list-container::-webkit-scrollbar{
  width:6px;
}

.list-container::-webkit-scrollbar-thumb{
  background:rgba(255,255,255,.12);
  border-radius:3px;
}

.log-card{
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.08);
  border-radius:16px;
  padding:14px;
  margin-bottom:12px;
}

.log-date{
  font-size:13px;
  color:#60a5fa;
  margin-bottom:8px;
}

.log-text{
  font-size:15px;
  line-height:1.65;
  color:#e5e7eb;
  white-space:pre-wrap;
}

.back-button{
  position:absolute;
  top:12px;
  left:12px;
  width:40px;
  height:40px;
  border-radius:50%;
  background:rgba(255,255,255,.08);
  color:#e5e7eb;
  border:none;
  font-size:18px;
  cursor:pointer;
}

.page-title{
  margin-top:14px;
  text-align:center;
  font-size:18px;
  font-weight:600;
  color:#f9fafb;
}

.analysis-block{
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.08);
  border-radius:16px;
  padding:14px;
  margin-top:12px;
  font-size:14px;
  line-height:1.7;
  color:#e5e7eb;
  white-space:pre-wrap;
}

.copy-button{
  margin-top:10px;
  border:none;
  background:#2563eb;
  color:white;
  padding:9px 14px;
  border-radius:10px;
  font-size:13px;
  cursor:pointer;
}

.empty{
  color:#6b7280;
  text-align:center;
  padding:30px 0;
  font-size:14px;
}
</style>
</head>
<body>

<!-- 首页：语音录入 -->
<div id="homePage" class="page active">
  <div class="top-space">
    <div style="text-align:center;">
      <button class="mic-button" id="micBtn">🎤</button>
      <div class="hint-text" id="micHint">点击开始语音记录</div>
    </div>
  </div>

  <div class="chat-container" id="chatBox">
    <div class="welcome">语音识别结果会在这里显示，像对话一样向下延伸。</div>
  </div>

  <div class="bottom-nav">
    <div class="nav-item active" data-page="homePage">
      <span>🏠</span>
      <span>主页</span>
    </div>
    <div class="nav-item" data-page="historyPage">
      <span>📋</span>
      <span>历史日志</span>
    </div>
    <div class="nav-item" data-page="analyzePage">
      <span>🔍</span>
      <span>日志分析</span>
    </div>
    <div class="nav-item" data-page="exportPage">
      <span>📤</span>
      <span>导出文件</span>
    </div>
  </div>
</div>

<!-- 历史日志页 -->
<div id="historyPage" class="page">
  <button class="back-button" id="backFromHistory">←</button>
  <div class="page-title">历史日志</div>
  <div class="list-container" id="historyBox"></div>
</div>

<!-- 日志分析页 -->
<div id="analyzePage" class="page">
  <button class="back-button" id="backFromAnalyze">←</button>
  <div class="page-title">日志分析</div>
  <div class="list-container" id="analyzeBox">
    <div class="welcome" style="margin-top:20px;">点击下方按钮生成分析提示词</div>
    <button class="copy-button" id="buildAnalyzeBtn" style="width:100%;margin-top:10px;">生成分析内容</button>
  </div>
</div>

<!-- 导出文件页 -->
<div id="exportPage" class="page">
  <button class="back-button" id="backFromExport">←</button>
  <div class="page-title">导出文件</div>
  <div class="list-container" id="exportBox">
    <div class="welcome" style="margin-top:20px;">将日志导出为可被 Word 打开的文件</div>
    <button class="copy-button" id="exportDocBtn" style="width:100%;margin-top:10px;">导出 Word 文件</button>
  </div>
</div>

<script>
const micBtn = document.getElementById('micBtn');
const micHint = document.getElementById('micHint');
const chatBox = document.getElementById('chatBox');

const historyBox = document.getElementById('historyBox');
const analyzeBox = document.getElementById('analyzeBox');
const exportBox = document.getElementById('exportBox');

const backFromHistory = document.getElementById('backFromHistory');
const backFromAnalyze = document.getElementById('backFromAnalyze');
const backFromExport = document.getElementById('backFromExport');

const buildAnalyzeBtn = document.getElementById('buildAnalyzeBtn');
const exportDocBtn = document.getElementById('exportDocBtn');

const navItems = document.querySelectorAll('.nav-item');

let recognition = null;

function getLogs(){
  const raw = localStorage.getItem('workLogs');
  return raw ? JSON.parse(raw) : [];
}

function saveLogs(arr){
  localStorage.setItem('workLogs', JSON.stringify(arr));
}

function showPage(pageId){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(pageId).classList.add('active');

  navItems.forEach(item=>{
    item.classList.toggle('active', item.dataset.page === pageId);
  });

  if(pageId === 'historyPage') renderHistory();
  if(pageId === 'analyzePage') renderAnalyze();
  if(pageId === 'exportPage') renderExport();
}

function addBubble(text, type='user'){
  const div = document.createElement('div');
  div.className = 'bubble ' + type;
  div.innerText = text;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}

micBtn.onclick = ()=>{
  if(!('webkitSpeechRecognition' in window)){
    addBubble('当前浏览器不支持语音识别，请使用 Chrome 或 Edge。', 'ai');
    return;
  }

  if(recognition){
    recognition.stop();
    return;
  }

  recognition = new webkitSpeechRecognition();
  recognition.lang = 'zh-CN';
  recognition.continuous = true;
  recognition.interimResults = false;

  micBtn.classList.add('recording');
  micBtn.innerText = '🔴';
  micHint.innerText = '正在录音，再次点击结束';

  recognition.onresult = e=>{
    const text = e.results[e.results.length - 1][0].transcript.trim();
    if(!text) return;

    addBubble(text, 'user');

    const now = new Date();
    const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;

    const logs = getLogs();
    logs.push({date:dateStr, content:text});
    saveLogs(logs);
  };

  recognition.onend = ()=>{
    micBtn.classList.remove('recording');
    micBtn.innerText = '🎤';
    micHint.innerText = '点击开始语音记录';
    recognition = null;

    addBubble('日志已保存。', 'ai');
  };

  recognition.onerror = ()=>{
    micBtn.classList.remove('recording');
    micBtn.innerText = '🎤';
    micHint.innerText = '语音识别出错，请重试';
    recognition = null;

    addBubble('语音识别出错，请重试。', 'ai');
  };

  recognition.start();
};

navItems.forEach(item=>{
  item.onclick = ()=>{
    const pageId = item.dataset.page;
    if(pageId) showPage(pageId);
  };
});

backFromHistory.onclick = ()=>showPage('homePage');
backFromAnalyze.onclick = ()=>showPage('homePage');
backFromExport.onclick = ()=>showPage('homePage');

function renderHistory(){
  historyBox.innerHTML = '';
  const logs = getLogs().slice().reverse();

  if(logs.length === 0){
    historyBox.innerHTML = '<div class="empty">暂无日志记录</div>';
    return;
  }

  logs.forEach(item=>{
    const card = document.createElement('div');
    card.className = 'log-card';
    card.innerHTML = `
      <div class="log-date">${item.date}</div>
      <div class="log-text">${item.content}</div>
    `;
    historyBox.appendChild(card);
  });
}

function renderAnalyze(){
  analyzeBox.innerHTML = '';

  const logs = getLogs();
  if(logs.length === 0){
    analyzeBox.innerHTML = '<div class="empty">暂无日志记录，无法生成分析</div>';
    return;
  }

  const allText = logs.map(i=>`【${i.date}】${i.content}`).join('\n');

  const promptText = `基于以下全部工作日志，做工作规律分析：

1. 区分工作事务与家庭事务；
2. 提取高频沟通对象、高频工作事项；
3. 识别经常停留在计划中、尚未落地的任务；
4. 总结时间分配特征；
5. 给出简短可执行的优化建议。

日志记录：
${allText}`;

  const block = document.createElement('div');
  block.className = 'analysis-block';
  block.innerText = promptText;

  const copyBtn = document.createElement('button');
  copyBtn.className = 'copy-button';
  copyBtn.innerText = '复制分析内容';
  copyBtn.onclick = ()=>{
    navigator.clipboard.writeText(promptText).then(()=>{
      copyBtn.innerText = '已复制';
      setTimeout(()=>copyBtn.innerText = '复制分析内容', 2000);
    });
  };

  analyzeBox.appendChild(block);
  analyzeBox.appendChild(copyBtn);
}

function renderExport(){
  exportBox.innerHTML = '';

  const logs = getLogs();
  if(logs.length === 0){
    exportBox.innerHTML = '<div class="empty">暂无日志记录，无法导出</div>';
    return;
  }

  const out = ["个人工作日志导出", ""];

  logs.forEach(l=>{
    out.push(`==== ${l.date} ====`);
    out.push(l.content);
    out.push("");
  });

  const content = out.join("\n");

  const block = document.createElement('div');
  block.className = 'analysis-block';
  block.innerText = content;

  const downloadBtn = document.createElement('button');
  downloadBtn.className = 'copy-button';
  downloadBtn.innerText = '下载 Word 文件';
  downloadBtn.onclick = ()=>{
    const blob = new Blob([content], {type:'application/msword'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = "工作日志导出.doc";
    document.body.appendChild(a);
    a.click();
    a.remove();
  };

  exportBox.appendChild(block);
  exportBox.appendChild(downloadBtn);
}
</script>

</body>
</html>
